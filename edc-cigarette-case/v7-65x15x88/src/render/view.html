<!doctype html><html><body style="margin:0"><script src="three.min.js"></script><script>
const P=new URLSearchParams(location.search); const f=P.get('f'), v=P.get('v')||'front';
fetch(f+'.json').then(r=>r.json()).then(ms=>{
const W=1000,H=1300; const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R.setSize(W,H); document.body.appendChild(R.domElement);
const S=new THREE.Scene(); S.background=new THREE.Color(0xeceae4);
const V={front:{p:[110,-250,150],l:[0,0,46],u:[0,0,1],fov:20},back:{p:[-110,250,140],l:[0,0,46],u:[0,0,1],fov:20},
 open:{p:[40,-460,230],l:[-30,0,46],u:[0,0,1],fov:20},base:{p:[0,-55,-95],l:[0,0,0],u:[0,-1,0],fov:14}}[v];
const cam=new THREE.PerspectiveCamera(V.fov,W/H,1,3000); cam.up.set(...V.u); cam.position.set(...V.p); cam.lookAt(...V.l);
S.add(new THREE.HemisphereLight(0xffffff,0x444440,0.55));
const L=new THREE.DirectionalLight(0xffffff,0.9); L.position.set(160,-220,260); S.add(L);
const L2=new THREE.DirectionalLight(0xfff2dd,0.35); L2.position.set(-220,120,80); S.add(L2);
const L3=new THREE.DirectionalLight(0xffffff,0.35); L3.position.set(0,-60,-200); S.add(L3); const L4=new THREE.DirectionalLight(0xffffff,0.55); L4.position.set(260,-90,30); S.add(L4); const L5=new THREE.DirectionalLight(0xffffff,0.4); L5.position.set(-260,90,30); S.add(L5);
for(const m of ms){const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(m.v,3)); g.setIndex(m.t);
 const n=g.toNonIndexed(); n.computeVertexNormals(); S.add(new THREE.Mesh(n,new THREE.MeshStandardMaterial({color:m.c,roughness:0.72,flatShading:true})));}
R.render(S,cam); document.title='done';});
</script></body></html>
